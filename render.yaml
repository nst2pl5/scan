services:
  - type: web
    name: solana-token-scanner
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn  app:app --bind=0.0.0.0:5001
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: PORT
        generateValue: true
    autoDeploy: true
