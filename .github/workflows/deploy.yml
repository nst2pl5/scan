name: Deploy Flask App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test Flask app
      run: |
        python -c "import app; print('✅ Flask app imports successfully')"
        python -c "from app import app; print('✅ Flask app configuration valid')"
    
    - name: Build application
      run: |
        echo "🔨 Building Flask application..."
        python -m py_compile app.py
        echo "✅ Application compiled successfully"
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🚀 Deploying to GitHub Pages..."
        echo "✅ Application ready for deployment"
        echo "📡 Live at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
