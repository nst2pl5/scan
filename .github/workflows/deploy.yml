name: Deploy Flask App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Flask app
      run: |
        python -c "import app; print('✅ Flask app imports successfully')"
        python -c "from app import app; print('✅ Flask app configuration valid')"

    - name: Validate Gunicorn
      run: |
        gunicorn --check-config app:app
        echo "✅ Gunicorn configuration valid"

    - name: Build validation
      run: |
        echo "🔨 Build validation completed"
        echo "✅ Ready for Render deployment"
        
    - name: Trigger Render Deploy
      if: github.ref == 'refs/heads/main'
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      run: |
        echo "🚀 Triggering Render deployment..."
        curl -X POST "https://api.render.com/deploy/srv-d3gg3f0gjchc739o6b9g?key=${RENDER_API_KEY}"
        echo "📡 Deployment triggered successfully"